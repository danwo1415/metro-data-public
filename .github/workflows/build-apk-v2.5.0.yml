name: Build Metro APK v2.5.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'metro-route-planner-v2.5.0-settings/**'
      - '.github/workflows/build-apk-v2.5.0.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: metro-route-planner-v2.5.0-settings

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: metro-route-planner-v2.5.0-settings-debug
          path: metro-route-planner-v2.5.0-settings/app/build/outputs/apk/debug/app-debug.apk

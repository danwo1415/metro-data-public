name: Update Hong Kong environment data

on:
  push:
    branches: [main]
    paths:
      - update_hk_environment.py
      - .github/workflows/update-hk-environment.yml
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hk-environment
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Fetch official EPD PM2.5 data
        run: python -u update_hk_environment.py

      - name: Validate JSON
        run: |
          python -m json.tool hk-environment.json >/dev/null
          python -m json.tool hk-environment-report.json >/dev/null

      - name: Publish changed environment data
        shell: bash
        run: |
          if git diff --quiet -- hk-environment.json hk-environment-report.json; then
            echo "Environment data is unchanged; nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hk-environment.json hk-environment-report.json
          git commit -m "Auto-update Hong Kong PM2.5"
          git pull --rebase origin main
          git push origin HEAD:main

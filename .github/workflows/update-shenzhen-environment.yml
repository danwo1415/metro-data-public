name: Update Shenzhen environment data

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: update-shenzhen-environment
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SZ_OPEN_DATA_APP_KEY: ${{ secrets.SZ_OPEN_DATA_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Fetch official Shenzhen data
        run: python -u update_shenzhen_environment.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shenzhen-environment-report
          path: shenzhen-environment-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit changed data
        run: |
          if git diff --quiet -- shenzhen-environment.json shenzhen-environment-report.json; then
            echo "No official value change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shenzhen-environment.json shenzhen-environment-report.json
          git commit -m "Update Shenzhen environment data"
          git push

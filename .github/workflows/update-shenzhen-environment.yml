name: Update Shenzhen environment data

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: shenzhen-public-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SZ_OPEN_DATA_APP_KEY: ${{ secrets.SZ_OPEN_DATA_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Fetch official Shenzhen environment data
        run: python -u update_shenzhen_environment.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shenzhen-environment-report
          path: shenzhen-environment-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shenzhen-environment.json shenzhen-environment-report.json
          if git diff --cached --quiet; then
            echo "No official value change"
            exit 0
          fi
          git commit -m "Update Shenzhen environment data"
          git pull --rebase origin main
          git push origin HEAD:main

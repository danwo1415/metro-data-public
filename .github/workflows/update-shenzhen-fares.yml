name: Update Shenzhen fares

on:
  workflow_dispatch:
  schedule:
    - cron: '43 2 * * 1'

permissions:
  contents: write

concurrency:
  group: shenzhen-public-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml openpyxl
      - name: Fetch official Shenzhen fare workbook
        run: python -u update_shenzhen_fares.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shenzhen-fares-report
          path: shenzhen-fares-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shenzhen-data.json shenzhen-version.json shenzhen-fares-report.json
          if git diff --cached --quiet; then
            echo "No fare changes"
            exit 0
          fi
          git commit -m "Update Shenzhen official fares"
          git pull --rebase origin main
          git push origin HEAD:main

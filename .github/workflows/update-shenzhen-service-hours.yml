name: Update Shenzhen service hours

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * * *'

permissions:
  contents: write

concurrency:
  group: shenzhen-public-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Fetch official Shenzhen timetables
        run: python -u update_shenzhen_service_hours.py

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shenzhen-service-hours-report
          path: shenzhen-service-hours-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shenzhen-data.json shenzhen-version.json shenzhen-service-hours-report.json
          if git diff --cached --quiet; then
            echo "No timetable changes"
            exit 0
          fi
          git commit -m "Update Shenzhen official service hours"
          git pull --rebase origin main
          git push origin HEAD:main

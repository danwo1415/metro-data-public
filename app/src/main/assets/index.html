let city='香港',from='ADM',to='TST',plan='fast',lastRoute=null;const $=id=>document.getElementById(id);const norm=s=>(s||'').toLowerCase().replace(/\s+/g,'').replace(/站$/,'');const hit=(o,q)=>{q=norm(q);return !q||norm(o.name).includes(q)||norm(o.en).includes(q)||o.py.includes(q)||o.ini.includes(q)||o.code.toLowerCase().includes(q)};

function picker(input,list,choose){const show=()=>{list.innerHTML='';const found=stations.filter(x=>hit(x,input.value)).slice(0,30);if(!found.length){const d=document.createElement('div');d.style.padding='10px';d.style.fontSize='12px';d.textContent='沒有符合的車站';list.appendChild(d)}found.forEach(x=>{const b=document.createElement('button');b.innerHTML='<b>'+x.name+(x.en?' '+x.en:'')+'</b><small>'+x.py+' · '+x.code+' · '+x.lines.map(l=>L[l].name).join('／')+'</small>';b.onclick=()=>{choose(x.code);list.style.display='none'};list.appendChild(b)});list.style.display='block'};input.onfocus=show;input.oninput=show}
picker($('fromInput'),$('fromList'),x=>{from=x;sync()});picker($('toInput'),$('toList'),x=>{to=x;sync()});
function route(mode){const starts=stationMap.get(from).lines.map(l=>key(l,from)),targets=new Set(stationMap.get(to).lines.map(l=>key(l,to)));const dist=new Map(),prev=new Map(),q=[];starts.forEach(s=>{dist.set(s,{time:0,tr:0});q.push(s)});while(q.length){q.sort((a,b)=>cmp(dist.get(a),dist.get(b),mode));const u=q.shift(),du=dist.get(u);if(targets.has(u))return build(u,prev,du);for(const e of graph.get(u)||[]){const nd={time:du.time+e.time,tr:du.tr+(e.kind==='transfer'?1:0)},old=dist.get(e.to);if(!old||cmp(nd,old,mode)<0){dist.set(e.to,nd);prev.set(e.to,{from:u,e});if(!q.includes(e.to))q.push(e.to)}}}return null}
function cmp(a,b,m){return m==='few'?(a.tr-b.tr||a.time-b.time):(a.time-b.time||a.tr-b.tr)}function build(end,prev,cost){const edges=[];let cur=end;while(prev.has(cur)){const p=prev.get(cur);edges.push({from:p.from,to:cur,...p.e});cur=p.from}edges.reverse();return {edges,cost,start:cur,end}}
function terminal(lineCode,fromCode,toCode){const arr=L[lineCode].stations.map(x=>x[0]),i=arr.indexOf(fromCode),j=arr.indexOf(toCode);if(lineCode==='EAL'&&toCode==='LMC')return '落馬洲';if(lineCode==='EAL'&&toCode==='LOW')return '羅湖';if(lineCode==='TKL'&&toCode==='LHP')return '康城';if(lineCode==='TKL'&&toCode==='POA')return '寶琳';return stationMap.get(j>i?arr[arr.length-1]:arr[0]).name}
function summarize(r){const parts=[];let current=null;r.edges.forEach(e=>{const [fl,fs]=e.from.split('|'),[tl,ts]=e.to.split('|');if(e.kind==='ride'){if(!current||current.line!==fl){if(current)parts.push(current);current={type:'leg',line:fl,start:fs,end:ts}}else current.end=ts}else{if(current){parts.push(current);current=null}parts.push({type:'transfer',station:e.station,distance:e.distance,time:e.time})}});if(current)parts.push(current);return parts}
function directionTerminalCode(lineCode,fromCode,toCode){const arr=L[lineCode].stations.map(x=>x[0]),i=arr.indexOf(fromCode),j=arr.indexOf(toCode);if(lineCode==='EAL'&&(toCode==='LOW'||toCode==='LMC'))return toCode;if(lineCode==='TKL'&&(toCode==='POA'||toCode==='LHP'))return toCode;if(j>i)return arr[arr.length-1];return arr[0]}
function isOriginTerminal(parts){const firstLeg=parts.find(x=>x.type==='leg');if(!firstLeg)return false;return firstLeg.start===directionTerminalCode(firstLeg.line,firstLeg.start,firstLeg.end)}
function parseClock(hhmm){const m=/^(\d{1,2}):(\d{2})$/.exec(hhmm||'');return m?+m[1]*60 + +m[2]:null}
function formatClock(total){if(total==null||!Number.isFinite(total))return '';total=((Math.round(total)%1440)+1440)%1440;return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0')}
function minusMinutes(hhmm,mins){const n=parseClock(hhmm);return n==null?'':formatClock(n-mins)}
function serviceRecord(leg){if(!leg)return null;const byLine=serviceHours?.[leg.start]?.[leg.line];if(!byLine)return null;const terminalCode=directionTerminalCode(leg.line,leg.start,leg.end);if(byLine[terminalCode])return byLine[terminalCode];const arr=L[leg.line].stations.map(x=>x[0]),i=arr.indexOf(leg.start),j=arr.indexOf(leg.end),dir=Math.sign(j-i);const candidates=Object.entries(byLine).filter(([dest,rec])=>{const k=arr.indexOf(dest);return rec&&k>=0&&Math.sign(k-i)===dir&&(dir>0?k>=j:k<=j)}).map(([,rec])=>rec);if(!candidates.length)return null;let first=null,last=null;for(const rec of candidates){const f=parseClock(rec.first),l=parseClock(rec.last);if(f!=null&&(first==null||f<first))first=f;if(l!=null){const x=l<360?l+1440:l;if(last==null||x>last)last=x}}return first==null||last==null?null:{first:formatClock(first),last:formatClock(last)}}
function estimateJourneyWindow(parts){const legs=parts.filter(x=>x.type==='leg');if(!legs.length)return null;let elapsed=0,earliest=-Infinity,latest=Infinity,missing=false;for(let i=0;i<parts.length;i++){const p=parts[i];if(p.type==='leg'){const rec=serviceRecord(p),f=rec&&parseClock(rec.first),l=rec&&parseClock(rec.last);if(f==null||l==null){missing=true;break}let last=l;if(last<360)last+=1440;earliest=Math.max(earliest,f-elapsed);latest=Math.min(latest,last-elapsed);const arr=L[p.line].stations.map(x=>x[0]),a=arr.indexOf(p.start),b=arr.indexOf(p.end);elapsed+=Math.abs(b-a)*(p.line==='AEL'?5:p.line==='SIL'?4:2.5)}else elapsed+=p.time}if(missing||!Number.isFinite(earliest)||!Number.isFinite(latest)||latest<earliest)return null;return {first:formatClock(earliest),last:formatClock(latest),estimated:parts.some(x=>x.type==='transfer')||!isOriginTerminal(parts)}}
function timeBoxes(parts){const rec=estimateJourneyWindow(parts);if(!rec){return `<div class="timebox"><div class="label">首班完整行程</div><strong>待資料刷新</strong><span>尚無逐站首班資料</span></div><div class="timebox"><div class="label">末班完整行程</div><strong>待資料刷新</strong><span>請查看港鐵官方公告</span></div>`}const prefix=rec.estimated?'約 ':'';const advised=minusMinutes(rec.last,5);return `<div class="timebox"><div class="label">首班完整行程</div><strong>${prefix}${rec.first}</strong><span>${rec.estimated?'按逐站時間推算':'始發站表定'}</span></div><div class="timebox"><div class="label">末班完整行程</div><strong>${prefix}${rec.last}</strong><span>建議 ${advised} 前到達月台</span></div>`}
const NEXT_TRAIN_URL='https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php';
const NEXT_TRAIN_UP_TERMINALS={AEL:new Set(['AIR','AWE']),TCL:new Set(['TUC']),TML:new Set(['TUM']),TKL:new Set(['POA','LHP']),EAL:new Set(['LMC','LOW','SHS','TAP','RAC','FOT','SHT']),SIL:new Set(['SOH']),TWL:new Set(['TSW']),ISL:new Set(['CHW']),KTL:new Set(['TIK']),DRL:new Set(['SUN'])};
const EAL_FOT_LOW=['ADM','EXC','HUH','MKK','KOT','TAW','SHT','FOT','UNI','TAP','TWO','FAN','SHS','LOW'];
const EAL_FOT_LMC=['ADM','EXC','HUH','MKK','KOT','TAW','SHT','FOT','UNI','TAP','TWO','FAN','SHS','LMC'];
const EAL_RAC_LOW=['ADM','EXC','HUH','MKK','KOT','TAW','SHT','RAC','UNI','TAP','TWO','FAN','SHS','LOW'];
const EAL_RAC_LMC=['ADM','EXC','HUH','MKK','KOT','TAW','SHT','RAC','UNI','TAP','TWO','FAN','SHS','LMC'];
const TKL_POA=['NOP','QUB','YAT','TIK','TKO','HAH','POA'];
const TKL_LHP=['NOP','QUB','YAT','TIK','TKO','LHP'];
const nextTrainCache=new Map();let nextTrainRequestId=0;
function nextTrainDirection(p){const terminalCode=directionTerminalCode(p.line,p.start,p.end),up=NEXT_TRAIN_UP_TERMINALS[p.line];return up&&up.has(terminalCode)?'UP':'DOWN'}
function nextTrainSequences(line,train){if(line==='EAL'){const viaRacecourse=(train.route||'')==='RAC'||train.dest==='RAC';return viaRacecourse?[EAL_RAC_LOW,EAL_RAC_LMC]:[EAL_FOT_LOW,EAL_FOT_LMC]}if(line==='TKL')return [TKL_POA,TKL_LHP];return [L[line].stations.map(x=>x[0])]}
function trainPassesLeg(p,train){if(!train||!train.time||!train.dest||train.valid==='N')return false;return nextTrainSequences(p.line,train).some(seq=>{const a=seq.indexOf(p.start),b=seq.indexOf(p.end),d=seq.indexOf(train.dest);if(a<0||b<0||d<0||a===b)return false;return b>a?d>=b:d<=b})}
function trainClock(value){const m=/(?:^|\s)(\d{2}:\d{2})(?::\d{2})?$/.exec(value||'');return m?m[1]:''}
function setNextTrainText(requestId,text){if(requestId!==nextTrainRequestId)return;const el=$('nextTrainInfo');if(el)el.textContent=text;requestAnimationFrame(fitViewport)}
async function loadNextTrains(p){const requestId=++nextTrainRequestId,el=$('nextTrainInfo');if(!el||!p)return;const direction=nextTrainDirection(p),cacheKey=[p.line,p.start,p.end,direction].join('|'),cached=nextTrainCache.get(cacheKey);if(cached&&Date.now()-cached.at<10000){setNextTrainText(requestId,cached.text);return}const fallback='臨近班次：暫無訊息';setNextTrainText(requestId,fallback);try{const url=NEXT_TRAIN_URL+'?line='+encodeURIComponent(p.line)+'&sta='+encodeURIComponent(p.start)+'&lang=TC';const data=await fetchJson(url,10000),node=data&&data.data&&data.data[p.line+'-'+p.start],trains=node&&Array.isArray(node[direction])?node[direction]:[];const times=[...new Set(trains.filter(t=>trainPassesLeg(p,t)).sort((a,b)=>(+a.seq||99)-(+b.seq||99)).map(t=>trainClock(t.time)).filter(Boolean))].slice(0,3);const text=times.length?'臨近班次：'+times.join('；'):fallback;nextTrainCache.set(cacheKey,{at:Date.now(),text});setNextTrainText(requestId,text)}catch(e){nextTrainCache.set(cacheKey,{at:Date.now(),text:fallback});setNextTrainText(requestId,fallback)}}
function leg(p,isFirst){return `<div class="leg" style="border-left-color:${L[p.line].color}"><div class="leg-head"><span class="badge">${L[p.line].name}</span><strong>${stationMap.get(p.start).name}上車</strong>${isFirst?'<span id="nextTrainInfo" class="next-trains">臨近班次：暫無訊息</span>':''}</div><p>往 <b>${terminal(p.line,p.start,p.end)}方向</b>｜至${stationMap.get(p.end).name}</p></div>`}
function transfer(p,nextLine){return `<div class="transfer"><div class="station">${stationMap.get(p.station).name}<br>換乘${nextLine?L[nextLine].name:''}</div><div><div class="label">預計距離</div><div class="value">${p.distance}米</div></div><div><div class="label">預計時間</div><div class="value">${Math.ceil(p.time)}分鐘</div></div></div>`}
function render(){renderCities();$('fromInput').value=stationMap.get(from).name;$('toInput').value=stationMap.get(to).name;const fast=plan==='fast';$('fastTab').classList.toggle('active',fast);$('fewTab').classList.toggle('active',!fast);if(from===to){$('result').innerHTML='<div class="error">起點和終點不能相同。</div>';return}const r=route(plan);lastRoute=r;if(!r){$('result').innerHTML='<div class="error">找不到可用路線。</div>';return}const parts=summarize(r);let routeHtml='',firstLeg=null;parts.forEach((p,i)=>{if(p.type==='leg'){const isFirst=!firstLeg;if(isFirst)firstLeg=p;routeHtml+=leg(p,isFirst)}else{const nx=parts.slice(i+1).find(x=>x.type==='leg');routeHtml+=transfer(p,nx&&nx.line)}});$('result').innerHTML=`<div class="summary"><h2>${fast?'時間最短':'換乘最少'}</h2><div class="meta">約${Math.ceil(r.cost.time)}分鐘｜換乘${r.cost.tr}次</div></div><div class="times">${timeBoxes(parts)}</div><div class="route">${routeHtml}</div><div class="notice">路線、站名、換乘關係使用港鐵真實路網；目前行車時間按站間估算，首末班由逐站、逐線、逐方向資料推算；始發站顯示表定時間，中途站或換乘行程加『約』，末班並提示提前5分鐘到達月台。</div>`;if(firstLeg)loadNextTrains(firstLeg)}
function fitViewport(){const app=document.querySelector('.app'),ad=$('adSlot');ad.classList.remove('visible');ad.style.height='0px';app.classList.remove('fit-1','fit-2','fit-3');const limit=window.innerHeight-2;if(app.scrollHeight>limit)app.classList.add('fit-1');if(app.scrollHeight>limit)app.classList.add('fit-2');if(app.scrollHeight>limit)app.classList.add('fit-3');requestAnimationFrame(()=>{const free=Math.floor(limit-app.scrollHeight);if(free>=100){ad.style.height=Math.min(150,Math.max(85,free-7))+'px';ad.classList.add('visible')}})}function sync(){render();requestAnimationFrame(fitViewport)}
const UPDATE_MANIFEST_URL='https://raw.githubusercontent.com/danwo1415/metro-data-public/main/version.json';
let pendingManifest=null,refreshInProgress=false,toastTimer=null;
function fetchJson(url,timeoutMs=15000){return new Promise((resolve,reject)=>{const x=new XMLHttpRequest(),full=url+(url.includes('?')?'&':'?')+'t='+Date.now();let settled=false;const finish=(fn,value)=>{if(settled)return;settled=true;fn(value)};x.open('GET',full,true);x.timeout=timeoutMs;x.onload=()=>{if(x.status<200||x.status>=300){finish(reject,new Error('HTTP '+x.status));return}try{finish(resolve,JSON.parse(x.responseText))}catch(e){finish(reject,new Error('資料格式錯誤'))}};x.onerror=()=>finish(reject,new Error('網路錯誤'));x.ontimeout=()=>finish(reject,new Error('連線逾時'));x.onabort=()=>finish(reject,new Error('下載已中止'));try{x.send()}catch(e){finish(reject,new Error('無法開始下載'))}})}
function showToast(text){const t=$('toast');t.textContent=text;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),2200)}
function hourStats(hours){let stations=0,records=0;for(const lines of Object.values(hours||{})){if(!lines||typeof lines!=='object')continue;stations++;for(const dirs of Object.values(lines||{}))records+=Object.keys(dirs||{}).length}return {stations,records}}
function applyServiceData(d,version,persist=true){if(!d||!d.serviceHours)throw new Error('資料沒有 serviceHours');const stats=hourStats(d.serviceHours);if(stats.stations<10||stats.records<20)throw new Error('首末班資料不足');serviceHours=d.serviceHours;if(persist){try{localStorage.setItem('metroDataOverride',JSON.stringify(d));localStorage.setItem('metroDataVersion',version||d.version||'updated')}catch(e){/* in-memory data remains usable */}}$('updatePanel').classList.remove('visible');sync();return stats}
async function loadLatestServiceData(ev){if(ev){ev.preventDefault();ev.stopPropagation()}if(refreshInProgress)return false;refreshInProgress=true;const b=$('refreshBtn');let succeeded=false;b.disabled=true;b.textContent='刷新中…';$('status').className='status';$('status').textContent='正在下載最新首末班資料…';requestAnimationFrame(fitViewport);try{const m=pendingManifest||await fetchJson(UPDATE_MANIFEST_URL);if(!m||!m.dataUrl)throw new Error('更新清單缺少 dataUrl');const d=await fetchJson(m.dataUrl);const stats=applyServiceData(d,m.version,true);pendingManifest=null;succeeded=true;$('status').className='status ok';$('status').textContent='已刷新：'+stats.stations+'站／'+stats.records+'條';showToast('已刷新')}catch(e){const cached=hourStats(serviceHours);$('updatePanel').classList.add('visible');$('status').className='status error';$('status').textContent=(cached.records?'刷新失敗，正在使用本機資料 '+cached.stations+'站／'+cached.records+'條：':'首末班資料下載失敗：')+(e&&e.message?e.message:'網路錯誤')}finally{refreshInProgress=false;b.disabled=false;b.textContent=succeeded?'刷新':'重試';requestAnimationFrame(fitViewport)}return false}
async function checkForUpdate(){const b=$('refreshBtn'),cached=hourStats(serviceHours);if(cached.records){$('status').className='status ok';$('status').textContent='本機首末班資料：'+cached.stations+'站／'+cached.records+'條｜正在檢查更新…'}else{$('status').className='status';$('status').textContent='正在檢查首末班資料更新…'}try{const m=await fetchJson(UPDATE_MANIFEST_URL);if(!m||!m.version||!m.dataUrl)throw new Error('更新清單格式錯誤');let localVersion='';try{localVersion=localStorage.getItem('metroDataVersion')||((savedData&&savedData.version)||'')}catch(e){}const needsUpdate=!cached.records||localVersion!==m.version;if(needsUpdate){pendingManifest=m;$('updatePanel').classList.add('visible');b.disabled=false;b.textContent=cached.records?'刷新':'下載';$('status').className='status';$('status').textContent=cached.records?'偵測到新版首末班資料｜目前使用本機 '+cached.stations+'站／'+cached.records+'條':'首末班資料可下載，請按刷新'}else{pendingManifest=null;$('updatePanel').classList.remove('visible');$('status').className='status ok';$('status').textContent='首末班資料已是最新：'+cached.stations+'站／'+cached.records+'條'}requestAnimationFrame(fitViewport)}catch(e){b.disabled=false;b.textContent='重試';$('updatePanel').classList.add('visible');$('status').className=cached.records?'status':'status error';$('status').textContent=(cached.records?'目前離線或無法檢查更新，繼續使用本機資料 '+cached.stations+'站／'+cached.records+'條：':'無法檢查首末班資料：')+(e&&e.message?e.message:'網路錯誤');requestAnimationFrame(fitViewport)}}
function openOfficialNews(ev){if(ev){ev.preventDefault();ev.stopPropagation()}try{if(window.AndroidApp&&typeof window.AndroidApp.openOfficialNews==='function'){window.AndroidApp.openOfficialNews();return false}}catch(e){}return false}
$('refreshBtn').addEventListener('pointerdown',e=>e.stopPropagation());
$('refreshBtn').onclick=loadLatestServiceData;
$('officialLink').onclick=openOfficialNews;
$('swapBtn').onclick=()=>{const t=from;from=to;to=t;sync()};$('fastTab').onclick=()=>{plan='fast';sync()};$('fewTab').onclick=()=>{plan='few';sync()};$('searchBtn').onclick=()=>{sync();const stats=hourStats(serviceHours);$('status').className=stats.records?'status ok':'status';$('status').textContent='已計算：'+stationMap.get(from).name+' → '+stationMap.get(to).name+(stats.records?'｜首末班 '+stats.stations+'站／'+stats.records+'條':'｜首末班尚未載入')};window.addEventListener('resize',()=>requestAnimationFrame(fitViewport));document.addEventListener('click',e=>{['from','to'].forEach(p=>{if(!e.target.closest('#'+p+'Input')&&!e.target.closest('#'+p+'List'))$(p+'List').style.display='none'})});sync();checkForUpdate();
</script>

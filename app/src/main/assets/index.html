<main class="app">

    <div class="weather-item"><span id="temperatureLabel" class="label">溫度</span><strong id="temperatureValue">--</strong></div>
    <div class="weather-item"><span id="humidityLabel" class="label">濕度</span><strong id="humidityValue">--</strong></div>
    <div class="weather-item"><span id="uvLabel" class="label">紫外線</span><strong id="uvValue">--</strong></div>
    <div class="weather-item"><span id="pm25Label" class="label">PM2.5</span><strong id="pm25Value">--</strong></div>

  <section>

  </section>
  <section class="search-row">

    <button id="swapBtn" class="swap" aria-label="交換起點終點">⇄</button>
    <div class="field"><label id="toLabel" for="toInput">終點</label><input id="toInput" autocomplete="off" placeholder="中文／英文／拼音"><div id="toList" class="suggest"></div></div>

  <section class="workspace"><div class="tabs"><button id="fastTab" class="btn tab active">時間最短</button><button id="fewTab" class="btn tab">換乘最少</button></div><article id="result" class="result" aria-live="polite"></article></section>
  <section id="updatePanel" class="update-panel"><span id="updateMessage">資訊有更新，請按刷新鍵刷新</span><button id="refreshBtn" class="refresh-btn" type="button">刷新</button></section>

function timeBoxes(parts){const rec=estimateJourneyWindow(parts);if(!rec){return `<div class="timebox"><div class="label">${tr('firstJourney')}</div><strong>${tr('waitingRefresh')}</strong><span>${tr('noFirstData')}</span></div><div class="timebox"><div class="label">${tr('lastJourney')}</div><strong>${tr('waitingRefresh')}</strong><span>${tr('seeOfficial')}</span></div>`}const prefix=rec.estimated?tr('approx'):'';const advised=minusMinutes(rec.last,5);return `<div class="timebox"><div class="label">${tr('firstJourney')}</div><strong>${prefix}${rec.first}</strong><span>${rec.estimated?tr('inferred'):tr('scheduledOrigin')}</span></div><div class="timebox"><div class="label">${tr('lastJourney')}</div><strong>${prefix}${rec.last}</strong><span>${tr('arriveBefore',{time:advised})}</span></div>`}
const weatherState={temperature:'--',humidity:'--',uv:'--',pm25:'--'};let weatherRequestId=0,weatherRefreshTimer=null;
function renderWeather(){const fmt=(key,value,unit='')=>value&&value!=='--'?String(value)+unit:'--';$('weatherRow').setAttribute('aria-label',tr('weatherInfo'));$('temperatureLabel').textContent=tr('temperature');$('humidityLabel').textContent=tr('humidity');$('uvLabel').textContent=tr('uv');$('pm25Label').textContent=tr('pm25');$('temperatureValue').textContent=fmt('temperature',weatherState.temperature,'°C');$('humidityValue').textContent=fmt('humidity',weatherState.humidity,'%');$('uvValue').textContent=fmt('uv',weatherState.uv);$('pm25Value').textContent=fmt('pm25',weatherState.pm25,' µg/m³')}
window.__nativeWeatherResolve=function(id,ok,payload){if(String(id)!==String(weatherRequestId))return;if(ok){try{const data=JSON.parse(payload||'{}');weatherState.temperature=data.temperature??'--';weatherState.humidity=data.humidity??'--';weatherState.uv=data.uv??'--';weatherState.pm25=data.pm25??'--'}catch(e){}}renderWeather();requestAnimationFrame(fitViewport)};
function loadWeather(){const id=String(++weatherRequestId);try{if(window.AndroidData&&typeof window.AndroidData.fetchWeather==='function'){window.AndroidData.fetchWeather(id);return}}catch(e){}renderWeather()}
function scheduleWeatherRefresh(){if(weatherRefreshTimer!==null)clearInterval(weatherRefreshTimer);weatherRefreshTimer=setInterval(()=>{if(document.visibilityState==='visible')loadWeather()},600000)}
const fareCache=new Map();let fareRequestId=0;
function fareCacheKey(a,b){return [a,b].sort().join('|')}
window.__nativeFareResolve=function(id,ok,value){if(String(id)!==String(fareRequestId))return;const el=$('fareInfo');if(!el)return;if(ok&&value){fareCache.set(fareCacheKey(from,to),String(value));el.textContent=tr('fareValue',{fare:value})}else el.textContent=tr('fareUnavailable');requestAnimationFrame(fitViewport)};
function loadFare(){const el=$('fareInfo');if(!el)return;const cacheKey=fareCacheKey(from,to),cached=fareCache.get(cacheKey);if(cached){el.textContent=tr('fareValue',{fare:cached});return}el.textContent=tr('fareLoading');const id=String(++fareRequestId);try{if(window.AndroidData&&typeof window.AndroidData.fetchFare==='function'){window.AndroidData.fetchFare(english[from]||'',english[to]||'',id);return}}catch(e){}el.textContent=tr('fareUnavailable')}
const NEXT_TRAIN_URL='https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php';
const NEXT_TRAIN_UP_TERMINALS={AEL:new Set(['AIR','AWE']),TCL:new Set(['TUC']),TML:new Set(['TUM']),TKL:new Set(['POA','LHP']),EAL:new Set(['LMC','LOW','SHS','TAP','RAC','FOT','SHT']),SIL:new Set(['SOH']),TWL:new Set(['TSW']),ISL:new Set(['CHW']),KTL:new Set(['TIK']),DRL:new Set(['SUN'])};
const EAL_FOT_LOW=['ADM','EXC','HUH','MKK','KOT','TAW','SHT','FOT','UNI','TAP','TWO','FAN','SHS','LOW'];
const EAL_FOT_LMC=['ADM','EXC','HUH','MKK','KOT','TAW','SHT','FOT','UNI','TAP','TWO','FAN','SHS','LMC'];
const EAL_RAC_LOW=['ADM','EXC','HUH','MKK','KOT','TAW','SHT','RAC','UNI','TAP','TWO','FAN','SHS','LOW'];
const EAL_RAC_LMC=['ADM','EXC','HUH','MKK','KOT','TAW','SHT','RAC','UNI','TAP','TWO','FAN','SHS','LMC'];
const TKL_POA=['NOP','QUB','YAT','TIK','TKO','HAH','POA'];
const TKL_LHP=['NOP','QUB','YAT','TIK','TKO','LHP'];
const nextTrainCache=new Map();let nextTrainRequestId=0,nextTrainRefreshTimer=null,activeFirstLeg=null;
function nextTrainDirection(p){const terminalCode=directionTerminalCode(p.line,p.start,p.end),up=NEXT_TRAIN_UP_TERMINALS[p.line];return up&&up.has(terminalCode)?'UP':'DOWN'}
function nextTrainSequences(line,train){if(line==='EAL'){const viaRacecourse=(train.route||'')==='RAC'||train.dest==='RAC';return viaRacecourse?[EAL_RAC_LOW,EAL_RAC_LMC]:[EAL_FOT_LOW,EAL_FOT_LMC]}if(line==='TKL')return [TKL_POA,TKL_LHP];return [L[line].stations.map(x=>x[0])]}
function trainPassesLeg(p,train){if(!train||!train.time||!train.dest||train.valid==='N')return false;return nextTrainSequences(p.line,train).some(seq=>{const a=seq.indexOf(p.start),b=seq.indexOf(p.end),d=seq.indexOf(train.dest);if(a<0||b<0||d<0||a===b)return false;return b>a?d>=b:d<=b})}
function trainClock(value){const m=/(?:^|\s)(\d{2}:\d{2})(?::\d{2})?$/.exec(value||'');return m?m[1]:''}
function setNextTrainText(requestId,text){if(requestId!==nextTrainRequestId)return;const el=$('nextTrainInfo');if(el)el.textContent=text;requestAnimationFrame(fitViewport)}
async function loadNextTrains(p,force=false){const requestId=++nextTrainRequestId,el=$('nextTrainInfo');if(!el||!p)return;const direction=nextTrainDirection(p),cacheKey=[appLang,p.line,p.start,p.end,direction].join('|'),cached=nextTrainCache.get(cacheKey);if(!force&&cached&&Date.now()-cached.at<10000){setNextTrainText(requestId,cached.text);return}const fallback=tr('nextTrains',{times:tr('noInfo')});try{const apiLang=appLang==='en'?'EN':'TC';const url=NEXT_TRAIN_URL+'?line='+encodeURIComponent(p.line)+'&sta='+encodeURIComponent(p.start)+'&lang='+apiLang;const data=await fetchJson(url,10000),node=data&&data.data&&data.data[p.line+'-'+p.start],trains=node&&Array.isArray(node[direction])?node[direction]:[];const times=[...new Set(trains.filter(t=>trainPassesLeg(p,t)).sort((a,b)=>(+a.seq||99)-(+b.seq||99)).map(t=>trainClock(t.time)).filter(Boolean))].slice(0,3);const text=tr('nextTrains',{times:times.length?times.join('；'):tr('noInfo')});nextTrainCache.set(cacheKey,{at:Date.now(),text});setNextTrainText(requestId,text)}catch(e){nextTrainCache.set(cacheKey,{at:Date.now(),text:fallback});setNextTrainText(requestId,fallback)}}
function clearNextTrainRefreshTimer(){if(nextTrainRefreshTimer!==null){clearInterval(nextTrainRefreshTimer);nextTrainRefreshTimer=null}}
function scheduleNextTrainRefresh(){clearNextTrainRefreshTimer();if(!activeFirstLeg||document.visibilityState!=='visible')return;nextTrainRefreshTimer=setInterval(()=>{if(activeFirstLeg&&document.visibilityState==='visible'&&$('nextTrainInfo'))loadNextTrains(activeFirstLeg,true)},10000)}
function startNextTrainRefresh(p){clearNextTrainRefreshTimer();activeFirstLeg=p?{...p}:null;if(!activeFirstLeg){nextTrainRequestId++;return}loadNextTrains(activeFirstLeg,true);scheduleNextTrainRefresh()}
function stopNextTrainRefresh(){activeFirstLeg=null;clearNextTrainRefreshTimer();nextTrainRequestId++}
function leg(p,isFirst){return `<div class="leg" style="border-left-color:${L[p.line].color}"><div class="leg-head"><span class="badge">${lineDisplay(p.line)}</span><strong>${tr('boardAt',{station:stationDisplay(p.start)})}</strong>${isFirst?'<span id="nextTrainInfo" class="next-trains">'+tr('nextTrains',{times:tr('noInfo')})+'</span>':''}</div><p>${tr('direction',{terminal:terminal(p.line,p.start,p.end),end:stationDisplay(p.end)})}</p></div>`}
function transfer(p,nextLine){return `<div class="transfer"><div class="station">${tr('transferTo',{station:stationDisplay(p.station),line:nextLine?lineDisplay(nextLine):''})}</div><div><div class="label">${tr('estimatedDistance')}</div><div class="value">${p.distance}${tr('meter')}</div></div><div><div class="label">${tr('estimatedTime')}</div><div class="value">${Math.ceil(p.time)}${tr('minute')}</div></div></div>`}
function render(){renderCities();$('fromInput').value=stationDisplay(from);$('toInput').value=stationDisplay(to);const fast=plan==='fast';$('fastTab').classList.toggle('active',fast);$('fewTab').classList.toggle('active',!fast);if(from===to){stopNextTrainRefresh();$('result').innerHTML='<div class="error">'+tr('sameStation')+'</div>';return}const r=route(plan);lastRoute=r;if(!r){stopNextTrainRefresh();$('result').innerHTML='<div class="error">'+tr('noRoute')+'</div>';return}const parts=summarize(r);let routeHtml='',firstLeg=null;parts.forEach((p,i)=>{if(p.type==='leg'){const isFirst=!firstLeg;if(isFirst)firstLeg=p;routeHtml+=leg(p,isFirst)}else{const nx=parts.slice(i+1).find(x=>x.type==='leg');routeHtml+=transfer(p,nx&&nx.line)}});$('result').innerHTML=`<div class="summary"><h2>${fast?tr('fast'):tr('few')}</h2><div class="meta"><span id="fareInfo">${tr('fareLoading')}</span>｜${tr('summary',{minutes:Math.ceil(r.cost.time),transfers:r.cost.tr})}</div></div><div class="times">${timeBoxes(parts)}</div><div class="route">${routeHtml}</div><div class="notice">${tr('notice')}</div>`;loadFare();startNextTrainRefresh(firstLeg)}
function fitViewport(){const app=document.querySelector('.app'),ad=$('adSlot');ad.classList.remove('visible');ad.style.height='0px';app.classList.remove('fit-1','fit-2','fit-3');const limit=window.innerHeight-2;if(app.scrollHeight>limit)app.classList.add('fit-1');if(app.scrollHeight>limit)app.classList.add('fit-2');if(app.scrollHeight>limit)app.classList.add('fit-3');requestAnimationFrame(()=>{const free=Math.floor(limit-app.scrollHeight);if(free>=100){ad.style.height=Math.min(150,Math.max(85,free-7))+'px';ad.classList.add('visible')}})}
let routeRenderToken=0,statusTimer=null;
function showStatus(text,kind='',autoHideMs=0){const s=$('status');clearTimeout(statusTimer);s.className='status visible'+(kind?' '+kind:'');s.textContent=text||'';if(autoHideMs>0)statusTimer=setTimeout(hideStatus,autoHideMs);requestAnimationFrame(fitViewport)}
function hideStatus(){clearTimeout(statusTimer);const s=$('status');s.className='status';s.textContent='';requestAnimationFrame(fitViewport)}
function sync(showCalculating=true){const token=++routeRenderToken;if(showCalculating)showStatus(tr('calculating'));requestAnimationFrame(()=>{if(token!==routeRenderToken)return;render();requestAnimationFrame(()=>{fitViewport();if(showCalculating&&token===routeRenderToken&&!refreshInProgress)hideStatus()})})}
function applyStaticLanguage(){document.documentElement.lang=appLang;document.title=tr('title');const app=document.querySelector('.app');app.classList.toggle('lang-en',appLang==='en');$('cityRow').setAttribute('aria-label',tr('selectCity'));renderWeather();$('fromLabel').textContent=tr('from');$('toLabel').textContent=tr('to');$('fromInput').placeholder=tr('placeholder');$('toInput').placeholder=tr('placeholder');$('swapBtn').setAttribute('aria-label',tr('swap'));$('fastTab').textContent=tr('fast');$('fewTab').textContent=tr('few');$('updateMessage').textContent=tr('updateAvailable');$('officialLead').textContent=tr('moreInfo');$('officialTitle').textContent=tr('officialNews');$('adSlot').setAttribute('aria-label',tr('ad'));$('adImage').alt=tr('ad');$('toast').textContent=tr('refreshed');$('langTrad').classList.toggle('active',appLang==='zh-Hant');$('langSimp').classList.toggle('active',appLang==='zh-Hans');$('langEn').classList.toggle('active',appLang==='en')}
function setLanguage(lang){if(!['zh-Hant','zh-Hans','en'].includes(lang)||lang===appLang)return;appLang=lang;try{localStorage.setItem('metroLanguage',lang)}catch(e){}nextTrainCache.clear();applyStaticLanguage();sync(false);if(refreshInProgress){$('refreshBtn').textContent=tr('refreshing');showStatus(tr('downloading'))}else{hideStatus();checkForUpdate()}}
const UPDATE_MANIFEST_URL='https://raw.githubusercontent.com/danwo1415/metro-data-public/main/version.json';
let pendingManifest=null,refreshInProgress=false,toastTimer=null;
function fetchJson(url,timeoutMs=15000){return new Promise((resolve,reject)=>{const x=new XMLHttpRequest(),full=url+(url.includes('?')?'&':'?')+'t='+Date.now();let settled=false;const finish=(fn,value)=>{if(settled)return;settled=true;fn(value)};x.open('GET',full,true);x.timeout=timeoutMs;x.onload=()=>{if(x.status<200||x.status>=300){finish(reject,new Error('HTTP '+x.status));return}try{finish(resolve,JSON.parse(x.responseText))}catch(e){finish(reject,new Error(tr('badData')))}};x.onerror=()=>finish(reject,new Error(tr('networkError')));x.ontimeout=()=>finish(reject,new Error(tr('timeout')));x.onabort=()=>finish(reject,new Error(tr('aborted')));try{x.send()}catch(e){finish(reject,new Error(tr('cannotStart')))}})}
function showToast(text){const t=$('toast');t.textContent=text;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),2200)}
function hourStats(hours){let stations=0,records=0;for(const lines of Object.values(hours||{})){if(!lines||typeof lines!=='object')continue;stations++;for(const dirs of Object.values(lines||{}))records+=Object.keys(dirs||{}).length}return {stations,records}}
function applyServiceData(d,version,persist=true){if(!d||!d.serviceHours)throw new Error(tr('noServiceHours'));const stats=hourStats(d.serviceHours);if(stats.stations<10||stats.records<20)throw new Error(tr('insufficientData'));serviceHours=d.serviceHours;if(persist){try{localStorage.setItem('metroDataOverride',JSON.stringify(d));localStorage.setItem('metroDataVersion',version||d.version||'updated')}catch(e){/* in-memory data remains usable */}}$('updatePanel').classList.remove('visible');sync(false);return stats}
async function loadLatestServiceData(ev){if(ev){ev.preventDefault();ev.stopPropagation()}if(refreshInProgress)return false;refreshInProgress=true;const b=$('refreshBtn');let succeeded=false;b.disabled=true;b.textContent=tr('refreshing');showStatus(tr('downloading'));try{const m=pendingManifest||await fetchJson(UPDATE_MANIFEST_URL);if(!m||!m.dataUrl)throw new Error(tr('missingDataUrl'));const d=await fetchJson(m.dataUrl);applyServiceData(d,m.version,true);pendingManifest=null;succeeded=true;hideStatus();showToast(tr('refreshed'))}catch(e){const cached=hourStats(serviceHours),error=e&&e.message?e.message:tr('networkError');$('updatePanel').classList.add('visible');showStatus(cached.records?tr('refreshFailedCached',{stats:statsText(cached),error}):tr('downloadFailed',{error}),'error',5000)}finally{refreshInProgress=false;b.disabled=false;b.textContent=succeeded?tr('refresh'):tr('retry');requestAnimationFrame(fitViewport)}return false}
async function checkForUpdate(){const b=$('refreshBtn'),cached=hourStats(serviceHours);try{const m=await fetchJson(UPDATE_MANIFEST_URL);if(!m||!m.version||!m.dataUrl)throw new Error(tr('badManifest'));let localVersion='';try{localVersion=localStorage.getItem('metroDataVersion')||((savedData&&savedData.version)||'')}catch(e){}const needsUpdate=!cached.records||localVersion!==m.version;if(needsUpdate){pendingManifest=m;$('updatePanel').classList.add('visible');b.disabled=false;b.textContent=cached.records?tr('refresh'):tr('download')}else{pendingManifest=null;$('updatePanel').classList.remove('visible');hideStatus()}requestAnimationFrame(fitViewport)}catch(e){const error=e&&e.message?e.message:tr('networkError');b.disabled=false;b.textContent=tr('retry');if(!cached.records){$('updatePanel').classList.add('visible');showStatus(tr('cannotCheck',{error}),'error',5000)}else{hideStatus()}requestAnimationFrame(fitViewport)}}
function openOfficialNews(ev){if(ev){ev.preventDefault();ev.stopPropagation()}try{if(window.AndroidApp&&typeof window.AndroidApp.openOfficialNews==='function'){window.AndroidApp.openOfficialNews();return false}}catch(e){}return false}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){loadWeather();if(activeFirstLeg){loadNextTrains(activeFirstLeg,true);scheduleNextTrainRefresh()}}else clearNextTrainRefreshTimer()});
window.addEventListener('pagehide',clearNextTrainRefreshTimer);
$('refreshBtn').addEventListener('pointerdown',e=>e.stopPropagation());
$('refreshBtn').onclick=loadLatestServiceData;
$('officialLink').onclick=openOfficialNews;
$('swapBtn').onclick=()=>{const t=from;from=to;to=t;sync()};$('fastTab').onclick=()=>{plan='fast';sync()};$('fewTab').onclick=()=>{plan='few';sync()};$('langTrad').onclick=()=>setLanguage('zh-Hant');$('langSimp').onclick=()=>setLanguage('zh-Hans');$('langEn').onclick=()=>setLanguage('en');window.addEventListener('resize',()=>requestAnimationFrame(fitViewport));document.addEventListener('click',e=>{['from','to'].forEach(p=>{if(!e.target.closest('#'+p+'Input')&&!e.target.closest('#'+p+'List'))$(p+'List').style.display='none'})});applyStaticLanguage();loadWeather();scheduleWeatherRefresh();sync(false);checkForUpdate();
</script>
